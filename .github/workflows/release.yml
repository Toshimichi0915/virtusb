# Push a tag like v1.2.3 to build Linux binaries and publish a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Fyne (GLFW) needs X11, Wayland and OpenGL headers.
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxxf86vm-dev libxi-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev
      - run: go vet . && go test .
      - run: go build -trimpath -ldflags="-s -w" -o virtusb-linux-${{ matrix.arch }} .
      - uses: actions/upload-artifact@v4
        with:
          name: virtusb-linux-${{ matrix.arch }}
          path: virtusb-linux-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes virtusb-linux-*
        env:
          GH_TOKEN: ${{ github.token }}
